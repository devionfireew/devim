<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Lite - Devi Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #ECEFF5; margin: 0; padding: 0; }
        .fb-header { background-color: #ffffff; border-bottom: 1px solid #ccd0d5; }
        .badge { background-color: #e41e3f; color: white; font-size: 10px; padding: 1px 5px; border-radius: 50%; font-weight: bold; position: absolute; top: -5px; right: -8px; }
        .story-card { width: 100px; height: 160px; border-radius: 10px; overflow: hidden; position: relative; flex-shrink: 0; background-size: cover; background-position: center; }
        .fb-btn { background-color: #1877f2; }
        .fb-btn:hover { background-color: #166fe5; }
    </style>
</head>
<body class="bg-[#ECEFF5] min-h-screen text-[#1d2129]">

    <!-- AUTH SECTION (Login / Signup) -->
    <div id="auth-section" class="max-w-sm mx-auto mt-12 p-4 bg-white rounded shadow border border-gray-300">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-[#1877f2] tracking-wider">facebook</h1>
            <p class="text-gray-500 text-xs mt-1">Lite Edition — 100% Working</p>
        </div>

        <div id="login-form" class="space-y-3">
            <input type="email" id="login-email" placeholder="Phone number or email" class="w-full p-2.5 border border-gray-300 rounded text-xs focus:outline-none focus:border-[#1877f2]">
            <input type="password" id="login-password" placeholder="Password" class="w-full p-2.5 border border-gray-300 rounded text-xs focus:outline-none focus:border-[#1877f2]">
            <button onclick="handleLogin()" class="w-full fb-btn text-white font-bold p-2.5 rounded text-xs shadow">Log In</button>
            <div class="text-center pt-2 border-t">
                <span onclick="toggleAuth()" class="text-[#1877f2] text-xs cursor-pointer font-bold">Create New Account</span>
            </div>
        </div>

        <div id="signup-form" class="hidden space-y-3">
            <h3 class="font-bold text-gray-700 text-center text-xs border-b pb-2">Sign Up for Facebook Lite</h3>
            <input type="text" id="signup-name" placeholder="Full Name" class="w-full p-2.5 border border-gray-300 rounded text-xs">
            <input type="text" id="signup-username" placeholder="Username" class="w-full p-2.5 border border-gray-300 rounded text-xs">
            <input type="email" id="signup-email" placeholder="Email address" class="w-full p-2.5 border border-gray-300 rounded text-xs">
            <input type="password" id="signup-password" placeholder="New password" class="w-full p-2.5 border border-gray-300 rounded text-xs">
            <button onclick="handleSignup()" class="w-full bg-[#42b72a] text-white font-bold p-2.5 rounded text-xs shadow">Sign Up</button>
            <div class="text-center pt-2 border-t">
                <span onclick="toggleAuth()" class="text-[#1877f2] text-xs cursor-pointer font-bold">Already have an account? Log In</span>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-section" class="hidden max-w-md mx-auto pb-12">

        <!-- Top Navigation Bar (Exact Screenshot Look)[span_1](start_span)[span_1](end_span) -->
        <header class="fb-header sticky top-0 z-50 shadow-sm">
            <div class="px-3 py-2 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-[#1877f2] tracking-tighter">facebook</h1>
                <div class="flex items-center space-x-2">
                    <button onclick="switchTab('feed')" class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-700">+</button>
                    <button onclick="switchTab('friends')" class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-700">🔍</button>
                    <button onclick="logout()" class="text-[10px] bg-red-600 text-white px-2 py-1 rounded font-bold">Logout</button>
                </div>
            </div>

            <!-- Sub Navbar Icons with Badges -->
            <div class="flex justify-around py-2 border-t border-gray-200 text-gray-600">
                <button onclick="switchTab('feed')" class="relative"><span class="text-xl">🏠</span><span class="badge">15+</span></button>
                <button onclick="switchTab('friends')" class="relative"><span class="text-xl">👥</span></button>
                <button onclick="switchTab('chat')" class="relative"><span class="text-xl">💬</span><span class="badge">1</span></button>
                <button onclick="switchTab('stories')" class="relative"><span class="text-xl">📖</span><span class="badge">3</span></button>
                <button onclick="switchTab('timeline')" class="relative"><span class="text-xl">👤</span></button>
            </div>
        </header>

        <!-- TAB 1: FEED -->
        <div id="tab-feed" class="space-y-2 mt-2">
            <div class="bg-white p-3 flex items-center space-x-3 shadow-sm border-b">
                <div class="w-10 h-10 bg-[#1877f2] rounded-full flex items-center justify-center text-white font-bold" id="user-avatar-initial">D</div>
                <input type="text" id="post-text" placeholder="What's on your mind?" class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-xs border outline-none">
                <button onclick="createPost()" class="fb-btn text-white px-3 py-1.5 rounded text-xs font-bold shadow">Post</button>
            </div>
            <div id="posts-container" class="space-y-2"></div>
        </div>

        <!-- TAB 2: STORIES -->
        <div id="tab-stories" class="hidden space-y-2 mt-2">
            <div class="bg-white p-3 shadow-sm">
                <h3 class="font-bold text-xs mb-2 text-gray-700">Create a Story</h3>
                <input type="text" id="story-caption" placeholder="Story caption..." class="w-full p-2 border rounded text-xs mb-2">
                <button onclick="addStory()" class="fb-btn text-white w-full py-1.5 rounded text-xs font-bold">Share Story</button>
            </div>
            <div id="stories-container" class="bg-white p-3 shadow-sm flex space-x-2 overflow-x-auto"></div>
        </div>

        <!-- TAB 3: FRIENDS & REQUESTS -->
        <div id="tab-friends" class="hidden space-y-2 mt-2">
            <div class="bg-white p-3 shadow-sm">
                <h3 class="font-bold text-xs mb-2 text-gray-700">Friend Requests</h3>
                <div id="requests-container" class="space-y-2 mb-4"></div>
                <h3 class="font-bold text-xs mb-2 text-gray-700 border-t pt-2">Find Friends</h3>
                <input type="text" id="search-user" placeholder="Search username..." oninput="searchUsers()" class="w-full p-2 border rounded text-xs mb-2">
                <div id="search-results" class="space-y-2"></div>
            </div>
        </div>

        <!-- TAB 4: CHAT / MESSENGER -->
        <div id="tab-chat" class="hidden bg-white p-3 shadow-sm mt-2">
            <h3 class="font-bold text-xs mb-2 text-gray-700">Messenger Lite</h3>
            <div id="chat-box" class="h-72 overflow-y-auto border p-2 rounded mb-2 bg-[#f9f9f9] text-xs space-y-2"></div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 p-2 border rounded text-xs">
                <button onclick="sendMessage()" class="fb-btn text-white px-3 py-1.5 rounded text-xs font-bold">Send</button>
            </div>
        </div>

        <!-- TAB 5: TIMELINE / PROFILE -->
        <div id="tab-timeline" class="hidden space-y-2 mt-2">
            <div class="bg-white p-4 shadow-sm text-center">
                <div class="w-14 h-14 fb-btn text-white rounded-full flex items-center justify-center font-bold text-xl mx-auto mb-2" id="profile-initial">D</div>
                <h2 class="font-bold text-sm text-[#1877f2]" id="profile-name">Loading...</h2>
                <p class="text-[10px] text-gray-500" id="profile-username">@username</p>
            </div>
            <div id="my-posts-container" class="space-y-2"></div>
        </div>

    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, query, where, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Yahan apni Firebase Console wali config dalein
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let userData = null;

        window.toggleAuth = function() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('signup-form').classList.toggle('hidden');
        }

        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            try { await signInWithEmailAndPassword(auth, email, pass); }
            catch(err) { alert("Login Error: " + err.message); }
        }

        window.handleSignup = async function() {
            const name = document.getElementById('signup-name').value;
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;
            if(!name || !username || !email || !pass) return alert("Sab fields bharein!");

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), {
                    user_id: res.user.uid, full_name: name, username: username, email: email, created_at: new Date().toISOString()
                });
                alert("Account ban gaya!");
            } catch(err) { alert("Signup Error: " + err.message); }
        }

        window.logout = async function() { await signOut(auth); }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if(docSnap.exists()) userData = docSnap.data();
                
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                if(userData) {
                    document.getElementById('user-avatar-initial').innerText = userData.full_name.charAt(0);
                }
                loadFeed();
                loadStories();
                loadFriendRequests();
                loadChat();
                loadTimeline();
            } else {
                currentUser = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        window.switchTab = function(tab) {
            ['feed', 'stories', 'friends', 'chat', 'timeline'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }

        // POSTS & FEED
        window.createPost = async function() {
            const text = document.getElementById('post-text').value;
            if(!text.trim()) return;

            try {
                await addDoc(collection(db, "posts"), {
                    author_id: currentUser.uid,
                    author_name: userData.full_name,
                    author_username: userData.username,
                    content: text,
                    likes: 0,
                    timestamp: new Date().toISOString()
                });
                document.getElementById('post-text').value = "";
                loadFeed();
            } catch(err) { alert("Post karne mein error aaya"); }
        }

        async function loadFeed() {
            const container = document.getElementById('posts-container');
            container.innerHTML = "<p class='text-center text-xs text-gray-500 py-2'>Loading feed...</p>";
            try {
                const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                container.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    container.innerHTML += `
                        <div class="bg-white p-3 shadow-sm border-b">
                            <div class="flex items-center mb-2">
                                <div class="w-8 h-8 fb-btn text-white rounded-full flex items-center justify-center font-bold text-xs mr-2">${p.author_name.charAt(0)}</div>
                                <div>
                                    <h4 class="font-bold text-xs text-[#1877f2]">${p.author_name}</h4>
                                    <span class="text-[10px] text-gray-400">@${p.author_username}</span>
                                </div>
                            </div>
                            <p class="text-gray-900 text-xs mb-2">${p.content}</p>
                            <div class="text-[10px] text-gray-500 font-semibold pt-2 border-t">❤️ ${p.likes || 0} Likes</div>
                        </div>
                    `;
                });
            } catch(err) { container.innerHTML = "<p class='text-center text-red-500 text-xs'>Feed load nahi ho saki.</p>"; }
        }

        // STORIES
        window.addStory = async function() {
            const text = document.getElementById('story-caption').value;
            if(!text.trim()) return;
            try {
                await addDoc(collection(db, "stories"), {
                    author_id: currentUser.uid,
                    author_name: userData.full_name,
                    content: text,
                    timestamp: new Date().toISOString()
                });
                document.getElementById('story-caption').value = "";
                loadStories();
            } catch(err) { alert("Story add nahi ho saki"); }
        }

        async function loadStories() {
            const container = document.getElementById('stories-container');
            const snap = await getDocs(collection(db, "stories"));
            container.innerHTML = "";
            snap.forEach(d => {
                const s = d.data();
                container.innerHTML += `
                    <div class="story-card bg-gray-800 text-white flex flex-col justify-between p-2">
                        <span class="text-[10px] font-bold bg-black/50 px-1 rounded">${s.author_name}</span>
                        <span class="text-xs">${s.content}</span>
                    </div>
                `;
            });
        }

        // FRIEND REQUESTS
        window.sendRequest = async function(targetId, targetName) {
            try {
                await addDoc(collection(db, "friend_requests"), {
                    sender_id: currentUser.uid,
                    sender_name: userData.full_name,
                    sender_username: userData.username,
                    receiver_id: targetId,
                    status: "pending",
                    timestamp: new Date().toISOString()
                });
                alert("Friend request bhej di gayi hai " + targetName + " ko!");
            } catch(err) { alert("Error sending request"); }
        }

        async function loadFriendRequests() {
            const container = document.getElementById('requests-container');
            const q = query(collection(db, "friend_requests"), where("receiver_id", "==", currentUser.uid), where("status", "==", "pending"));
            const snap = await getDocs(q);
            container.innerHTML = snap.empty ? "<p class='text-xs text-gray-400'>Koi pending request nahi hai.</p>" : "";
            snap.forEach(d => {
                const req = d.data();
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded text-xs border">
                        <span>@${req.sender_username} (${req.sender_name})</span>
                        <button onclick="acceptRequest('${d.id}')" class="bg-green-600 text-white px-2.5 py-1 rounded font-bold">Accept</button>
                    </div>
                `;
            });
        }

        window.acceptRequest = async function(reqId) {
            await updateDoc(doc(db, "friend_requests", reqId), { status: "accepted" });
            alert("Friend request accept ho gayi!");
            loadFriendRequests();
        }

        window.searchUsers = async function() {
            const queryText = document.getElementById('search-user').value.toLowerCase();
            const resContainer = document.getElementById('search-results');
            if(!queryText) { resContainer.innerHTML = ""; return; }
            
            const snap = await getDocs(collection(db, "users"));
            resContainer.innerHTML = "";
            snap.forEach(d => {
                const u = d.data();
                if(u.username.toLowerCase().includes(queryText) && u.user_id !== currentUser.uid) {
                    resContainer.innerHTML += `
                        <div class="p-2 border rounded text-xs flex justify-between items-center bg-gray-50">
                            <span>@${u.username} (${u.full_name})</span>
                            <button onclick="sendRequest('${u.user_id}', '${u.full_name}')" class="fb-btn text-white px-2 py-1 rounded font-bold">Add Friend</button>
                        </div>
                    `;
                }
            });
        }

        // CHAT MESSENGER
        window.sendMessage = async function() {
            const text = document.getElementById('chat-input').value;
            if(!text.trim()) return;
            try {
                await addDoc(collection(db, "messages"), {
                    sender_id: currentUser.uid,
                    sender_name: userData.full_name,
                    message: text,
                    timestamp: new Date().toISOString()
                });
                document.getElementById('chat-input').value = "";
                loadChat();
            } catch(err) { alert("Message nahi gaya"); }
        }

        async function loadChat() {
            const box = document.getElementById('chat-box');
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            const snap = await getDocs(q);
            box.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                box.innerHTML += `<div><span class="font-bold text-[#1877f2]">${m.sender_name}:</span> ${m.message}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        }

        // TIMELINE
        async function loadTimeline() {
            document.getElementById('profile-name').innerText = userData.full_name;
            document.getElementById('profile-username').innerText = "@" + userData.username;
            document.getElementById('profile-initial').innerText = userData.full_name.charAt(0);

            const container = document.getElementById('my-posts-container');
            const q = query(collection(db, "posts"), where("author_id", "==", currentUser.uid));
            const snap = await getDocs(q);
            container.innerHTML = snap.empty ? "<p class='text-center text-xs text-gray-400'>Aapki timeline par koi post nahi hai.</p>" : "";
            snap.forEach(d => {
                const p = d.data();
                container.innerHTML += `
                    <div class="bg-white p-3 shadow-sm border-b">
                        <p class="text-gray-900 text-xs">${p.content}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
